<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Ari — запись к мастерам Еревана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Armenian:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --card:#F4F5F7; --ink:#0F1115; --muted:#5B6270; --line:#E2E5EA;
  --accent:#FF5A3C; --accent-ink:#0F1115; --apricot:#FF5A3C; --apricot-soft:#F4F5F7; --ok:#0B7A54;
  --coral:#FF5A3C; --on-coral:#0F1115; --mint:#14B07C; --on-mint:#0F1115; --indigo:#3D4BE0; --on-indigo:#FFFFFF;
  --slot-busy:#F4F5F7; --focus:#3D4BE0; --sec:#FF5A3C; --on-sec:#0F1115;
  --shadow:none; --shadow-sheet:0 -12px 40px -8px rgba(15,17,21,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1115; --card:#181B21; --ink:#FFFFFF; --muted:#8A909C; --line:#262A31;
    --accent:#FF5A3C; --accent-ink:#0F1115; --apricot:#FF5A3C; --apricot-soft:#181B21; --ok:#1FC08A;
    --coral:#FF5A3C; --on-coral:#0F1115; --mint:#1FC08A; --on-mint:#0F1115; --indigo:#7C86F5; --on-indigo:#0F1115;
    --slot-busy:#2A2F37; --focus:#7C86F5; --sec:#FF5A3C; --on-sec:#0F1115;
    --shadow:none; --shadow-sheet:0 -12px 40px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1115; --card:#181B21; --ink:#FFFFFF; --muted:#8A909C; --line:#262A31;
  --accent:#FF5A3C; --accent-ink:#0F1115; --apricot:#FF5A3C; --apricot-soft:#181B21; --ok:#1FC08A;
  --coral:#FF5A3C; --on-coral:#0F1115; --mint:#1FC08A; --on-mint:#0F1115; --indigo:#7C86F5; --on-indigo:#0F1115;
  --slot-busy:#2A2F37; --focus:#7C86F5; --sec:#FF5A3C; --on-sec:#0F1115;
  --shadow:none; --shadow-sheet:0 -12px 40px -8px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:Manrope,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
img{max-width:100%}
.app{max-width:480px;margin:0 auto;padding:0 18px 110px}
h1,h2,h3{font-family:Manrope,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px;line-height:1.2}
h3{font-size:16px;line-height:1.25;font-weight:500}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font-family:Manrope,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.role{font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.back{display:flex;align-items:center;gap:6px;font-weight:500;padding:6px 0}

/* chips & buttons */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:500;border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot{flex:none;padding:10px 14px;border-radius:14px;background:var(--apricot-soft);font-weight:600;font-size:15px;border:1.5px solid transparent;text-align:center}
.slot small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.slot.on{border-color:var(--accent);background:var(--card)}
.slot[disabled]{opacity:.35;cursor:default}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:10px 14px;border-radius:14px;font-size:14px;width:auto}
.row{display:flex;gap:10px}
.row>*{flex:1}
.row>.btn.ghost[data-a$="Back"]{flex:.6}
.link{color:var(--accent);font-weight:500}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ava{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:Manrope,sans-serif;font-weight:700;font-size:20px;color:#fff}
.ava.xl{width:88px;height:88px;border-radius:28px;font-size:32px}
.mcard{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.mcard .body{flex:1;min-width:0}
.mcard .meta{font-size:14px;color:var(--muted);margin-top:2px}
.mcard .next{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;background:var(--apricot-soft);padding:5px 10px;border-radius:10px}
.star{color:var(--apricot)}

/* hello */
.hello{padding:8px 0 4px}
.hello p{margin-top:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin:18px 0 12px;border:1px solid var(--line)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px}
.again{display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:22px;padding:16px;margin-top:18px}
.again .btn{background:var(--apricot);color:#231A1E;width:auto;padding:10px 14px;border-radius:14px;font-size:14px}

/* service list */
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.svc:first-child{border-top:0}
.svc b{font-weight:600}
.price{font-weight:600;white-space:nowrap}

/* events */
.ev{display:flex;gap:14px;text-align:left;width:100%}
.date{flex:none;width:58px;border-radius:16px;background:var(--apricot-soft);text-align:center;padding:8px 0}
.date b{display:block;font-family:Manrope,sans-serif;font-size:22px;line-height:1.1}
.date span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--bg);color:var(--muted)}
.tag.hot{background:var(--accent);color:var(--accent-ink)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);z-index:10}
.tabs .in{max-width:480px;margin:0 auto;display:flex}
.tab{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,12,16,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .in{max-width:480px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;padding:10px 0;border-radius:16px;background:var(--card);text-align:center;border:1.5px solid transparent}
.day b{display:block;font-size:18px;font-family:Manrope,sans-serif}
.day span{font-size:12px;color:var(--muted)}
.day.on{border-color:var(--accent)}
.day[disabled]{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.note{background:var(--apricot-soft);border-radius:16px;padding:12px 14px;font-size:14px}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum:last-child{border-bottom:0}

/* done */
.done{text-align:center;padding-top:30px}
.check{width:84px;height:84px;border-radius:50%;background:var(--accent);margin:0 auto 20px;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.check svg{width:40px;height:40px;stroke:var(--accent-ink);stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .25s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.ticket{background:var(--card);border-radius:24px;margin:24px 0 16px;text-align:left;box-shadow:var(--shadow);overflow:hidden}
.ticket .t1{padding:18px}
.ticket .t2{padding:14px 18px;border-top:2px dashed var(--line);display:flex;justify-content:space-between;font-size:14px}
.ticket .big{font-family:Manrope,sans-serif;font-size:24px;margin-top:6px}
.bot{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border-radius:18px;padding:12px 14px;font-size:14px;border:1px solid var(--line)}

/* master cabinet */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:Manrope,sans-serif;font-size:24px}
.stat span{font-size:12px;color:var(--muted);line-height:1.2;display:block;margin-top:4px}
.bk{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0}
.bk .tm{font-family:Manrope,sans-serif;font-weight:500;width:56px;flex:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--card);border-radius:18px;padding:16px 14px;text-align:left;font-weight:600;box-shadow:var(--shadow);font-size:15px}
.act span{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.dtog{display:flex;gap:6px}
.dtog button{flex:1;padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.dtog button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tmpl{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tmpl:first-child{border-top:0}
.tmpl input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.tmpl .nm{flex:1}
.tmpl input[type=number]{width:96px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:right}
.story{aspect-ratio:9/16;max-width:220px;margin:0 auto;border-radius:24px;background:var(--accent);color:var(--accent-ink);padding:22px 18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:var(--shadow)}
.story .logo{font-size:15px}
.story .logo i{background:var(--apricot)}
.story h2{font-size:22px}
.story .cta{background:var(--apricot);color:#231A1E;border-radius:14px;padding:10px 12px;font-weight:600;font-size:14px;text-align:center}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.empty{text-align:center;padding:36px 18px}
.empty p{margin:8px 0 18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.proto{font-size:12px;color:var(--muted);text-align:center;margin-top:34px}
.ava.ph{background-size:cover;background-position:center;color:transparent}
.hero{margin:6px -18px 0;height:260px;background-size:cover;background-position:center 30%;border-radius:0 0 32px 32px;position:relative}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to bottom,transparent 55%,rgba(20,12,16,.35))}
.upload{display:flex;gap:14px;align-items:center}
.upload .ava{cursor:pointer}
.tg{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 8px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:14px;text-align:left}
.consent input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.cta-bar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin:24px -18px 0;padding:18px 18px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.plan{border:2px solid var(--line);border-radius:22px;padding:18px;background:var(--card)}
.plan.on{border-color:var(--accent)}
.plan .pr{font-family:Manrope,sans-serif;font-size:24px;margin:6px 0 10px}
.plan li{margin:4px 0;font-size:14px}
.plan ul{padding-left:18px;margin:0}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent)}
.bigmap{height:52vh;min-height:280px;border-radius:22px;overflow:hidden;margin-top:12px;background:var(--line);box-shadow:var(--shadow)}
.locbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.near .mcard{background:none;padding:0}
.pop{font-family:Manrope,sans-serif;font-size:13px;line-height:1.4;min-width:170px}
.pop span{color:#7A6A6E}
.searchrow{display:flex;gap:10px;align-items:center;margin:18px 0 12px}
.searchrow .search{flex:1;margin:0}
.mapbtn{flex:none;width:50px;height:50px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.mapbtn svg{width:24px;height:24px}
.map{height:220px;border-radius:16px;overflow:hidden;background:var(--line);margin-top:4px;z-index:0}
.gal{display:flex;gap:8px;overflow-x:auto;margin:6px -18px 0;padding:0 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{height:220px;width:auto;max-width:85%;border-radius:20px;object-fit:cover;scroll-snap-align:start;flex:none}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{aspect-ratio:1;border-radius:14px;background-size:cover;background-position:center;position:relative;background-color:var(--line)}
.th button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px}
.th.add{display:grid;place-items:center;font-size:28px;color:var(--muted);cursor:pointer}
.qr{display:flex;justify-content:center;margin:18px 0 8px}
.qr img,.qr canvas{border-radius:12px;background:#fff;padding:10px}
.rv{padding:14px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv .stars{color:var(--apricot);letter-spacing:1px}
.rv .reply{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:14px}
.bigstars{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}
.bigstars button{font-size:36px;color:var(--apricot);line-height:1}
.doc{display:block;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.bell{position:relative;width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.bell svg{width:20px;height:20px}
.bell.dot::after{content:"";position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.topr{display:flex;gap:8px;align-items:center}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bub{max-width:86%;padding:12px 14px;border-radius:20px 20px 20px 6px;background:var(--card);box-shadow:var(--shadow);animation:rise .3s ease-out both}
.bub.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:var(--accent);color:var(--accent-ink)}
.bub .when{display:block;font-size:11px;color:var(--muted);margin-top:6px;text-align:right}
.bub.me .when{color:inherit;opacity:.7}
.bub .kb{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bub .kb button,.bub .kb a{flex:1;min-width:90px;padding:9px 10px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:600;text-align:center;color:var(--accent);text-decoration:none}
.bub .kb .done{color:var(--ok);background:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pick button{padding:14px 16px;border-radius:16px;background:var(--card);text-align:left;font-weight:600;border:1.5px solid var(--line)}
.pick button span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.idcard{border-radius:26px;padding:22px;background:var(--ink);color:var(--bg);text-align:left;position:relative;overflow:hidden;margin:18px 0}
.idcard .no{font-family:"IBM Plex Mono",monospace;font-size:13px;opacity:.7;position:relative}
.idcard h2{font-size:26px;margin:22px 0 4px;position:relative}
.idcard p{position:relative;opacity:.75;font-size:14px}
.tours{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;scrollbar-width:none}
.tours::-webkit-scrollbar{display:none}
.tour{flex:none;width:230px;border-radius:22px;padding:16px;background:#1F6F8B;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:150px}
.tour h3{margin-top:6px}
.tour span{font-size:13px;opacity:.85}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--ok);margin-top:10px}
.sched{font-size:14px;padding:10px 0;border-top:1px solid var(--line);display:flex;gap:12px}
.sched:first-child{border-top:0}
.sched b{flex:none;width:112px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.check svg{stroke-dashoffset:0}}

/* ================= Ari «Слот»: фирменный слой ================= */
body{font-family:Manrope,"Noto Sans Armenian",system-ui,sans-serif;font-weight:500;line-height:1.5;font-variant-numeric:tabular-nums}
h1,h2,h3,.big,.stat b,.date b,.day b,.tm,.ticket .big{font-family:Manrope,"Noto Sans Armenian",system-ui,sans-serif}
h1{font-weight:800;font-size:28px;line-height:1.12;letter-spacing:-.02em}

.slot small{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}

.next{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;font-weight:800;padding:5px 12px}

.star,.rv .stars,.bigstars button{color:var(--coral)}
.sw.on{background:var(--ink)}
.steps i{background:var(--slot-busy)} .steps i.on{background:var(--coral)}

body[data-sec="t"]{--sec:var(--indigo);--on-sec:var(--on-indigo)}

.pop .btn{background:#0F1115;color:#fff}
.pill{display:inline-block;background:var(--coral);color:var(--on-coral);border-radius:999px;padding:2px 18px;font-weight:800}
.card .row{flex-wrap:wrap}
.card .row>.btn.small{flex:1 1 auto}
</style>

function slotsFor(m, key, dur, ignoreId) {
  const d = fromKey(key);
  if (!m.schedule.days.includes(d.getDay())) return [];
  const busy = S.bookings.filter(b => b.masterId === m.id && b.date === key && active(b) && b.id !== ignoreId && !b.eventId)
    .map(b => [toMin(b.time), toMin(b.time) + (b.dur || 60)]);
  S.events.filter(e => e.masterId === m.id && e.date === key).forEach(e => busy.push([toMin(e.time), toMin(e.time) + e.dur]));
  (S.busy || []).filter(x => x.masterId === m.id && x.date === key).forEach(x => busy.push([toMin(x.time), toMin(x.time) + x.dur]));
  const nowMin = nowMinY() + 60;
  const out = [];
  for (let s = m.schedule.from * 60; s + dur <= m.schedule.to * 60; s += 60) {
    if (key === dkey(today()) && s < nowMin) continue;
    if (busy.some(([a, b]) => s < b && s + dur > a)) continue;
    out.push(toTime(s));
  }
  return out;
}

function notifs() {

      if (active(b) && !e) out.push({ at: st + ((b.dur || 60) + 60) * 6e4, text: `Как всё прошло? ${esc(name)}, ${esc(m.name)}. Оценка займёт секунду`, kb: `<button data-a="tab" data-v="mine">Оценить</button><button data-a="rebook" data-id="${b.id}">Записаться снова</button>` });

      if (active(b) && st - 36e5 > cr) out.push({ at: st - 36e5, text: `Через час: ${esc(b.clientName)}, ${esc(name)}${b.confirmed ? '. Клиент подтвердил визит ✓' : ''}` });
      if (b.confirmedAt) out.push({ at: Date.parse(b.confirmedAt), text: `${esc(b.clientName)} подтвердил(а) визит ${shortDay(b.date).toLowerCase()} в ${b.time}` });

  if (ob.step === 2 && !ob.svcs.some(s => s.on)) return toast('Отметь хотя бы одну услугу');
  if (ob.step === 3) { if (!ob.days.length) return toast('Выбери рабочие дни'); if (ob.to - ob.from < 1) return toast('Проверь часы работы'); }
  if (ob.step === 4) {
    if (!ob.agree) return toast('Нужно принять оферту');
    if (ob.prepayOn && /\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}/.test(ob.payInfo)) return toast('Не указывай номер карты — лучше Idram, Telcell или ссылку');
    const m = { id: 'my_' + uid(), name: ob.name, cat: ob.cat, about: ob.about, area: ob.area, address: ob.address, prepay: ob.prepayOn ? ob.prepay : 0, payInfo: ob.prepayOn ? ob.payInfo : '', photo: ob.photo, plan: 'free', langs: ob.langs || '', registry: !!ob.registry, lat: ob.lat || null, lng: ob.lng || null, entrance: ob.entrance || '', entrancePhoto: ob.entrancePhoto || '',
      services: ob.svcs.filter(s => s.on).map(s => ({ id: uid(), name: s.name, dur: s.dur, price: s.price })), schedule: { days: ob.days.slice(), from: ob.from, to: ob.to }, rating: 0, reviews: 0, isMine: true };
    S.masters.unshift(m); S.myMasterId = m.id; if (!S.me.name) S.me.name = ob.name; save();
  }
  ob.step++; render(); window.scrollTo(0, 0);
}

function closeSheet() { $('#veil').classList.remove('on'); $('#sheet').classList.remove('on'); bk = null; }
function startBooking(mId, sId, k, t, moveId) {
  const m = M(mId);
  bk = { mId, sId: sId || (m.services.length === 1 ? m.services[0].id : null), k: k || null, t: t || null, moveId: moveId || null };
  if (!bk.k && bk.sId) { const s = svcOf(m, bk.sId); for (let i = 0; i < 21; i++) { const kk = dkey(addDays(today(), i)); if (slotsFor(m, kk, s.dur, moveId).length) { bk.k = kk; break; } } }
  renderSheet();
}
function renderSheet() {
  const m = M(bk.mId), s = bk.sId && svcOf(m, bk.sId);
  const step = !s ? 1 : (!bk.t ? 2 : 3);
  const bar = `<div class="steps">${[1,2,3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;

  if (step === 2) {

  }

      <div class="sum"><span class="muted">Мастер</span><b>${esc(m.name)}</b></div>
      <div class="sum"><span class="muted">Услуга</span><b>${esc(s.name)}</b></div>
      <div class="sum"><span class="muted">Когда</span><b>${shortDay(bk.k)}, ${bk.t}</b></div>
      <div class="sum"><span class="muted">Стоимость</span><b>${money(s.price)}</b></div></div>
      ${need ? `<div class="stack" style="margin-top:14px"><p class="small muted">Один раз — чтобы мастер знал, кого ждать. В Telegram это заполнится само</p><div class="field"><input id="meName" placeholder="Твоё имя" value="${esc(S.me.name)}" autocomplete="given-name"></div><div class="field"><input id="mePhone" type="tel" placeholder="+374 ..." value="${esc(S.me.phone)}" autocomplete="tel"></div></div>` : `<p class="small muted" style="margin-top:12px">${esc(S.me.name)}, ${esc(S.me.phone)}</p>`}
      ${m.prepay && !bk.moveId ? `<div class="note" style="margin-top:14px">Предоплата ${money(m.prepay)} переводится напрямую мастеру. Бесплатная отмена за 24 часа до визита.</div>` : ''}
      ${S.me.consent ? '' : `<label class="consent"><input type="checkbox" id="bkAgree"><span>${CONSENT}</span></label>`}

async function mountMaps() {

}

/* ---------- время: «свободно сегодня вечером» ---------- */
let when = 'any';
const WHEN = [['any', 'Любое время'], ['today', 'Сегодня'], ['eve', 'Сегодня вечером'], ['tmr', 'Завтра'], ['wknd', 'Выходные']];
function whenDays() {
  const t = today(), k = dkey(t);
  if (when === 'today') return [{ k, from: 0 }];
  if (when === 'eve') return [{ k, from: 17 * 60 }];
  if (when === 'tmr') return [{ k: dkey(addDays(t, 1)), from: 0 }];
  if (when === 'wknd') { const out = []; for (let i = 0; i < 7 && out.length < 2; i++) { const d = addDays(t, i); if (d.getDay() === 6 || d.getDay() === 0) out.push({ k: dkey(d), from: 0 }); } return out; }
  return null;
}
function firstSlot(m) {
  const days = whenDays(); if (!days) return nearest(m, 1)[0] || null;
  const dur = (m.services[0] || { dur: 60 }).dur;
  for (const d of days) { const sl = slotsFor(m, d.k, dur).filter(t => toMin(t) >= d.from); if (sl.length) return { k: d.k, t: sl[0] }; }
  return null;
}
const salonMembers = sl => (sl.members || []).map(M).filter(Boolean);
function salonFirstSlot(sl) { let best = null; salonMembers(sl).forEach(m => { const f = firstSlot(m); if (f && (!best || (f.k + f.t) < (best.k + best.t))) best = f; }); return best; }

  return Object.values(map).sort((a, b) => b.masters.length - a.masters.length);
}

let sb = null;
function salonSlots(sl, svc, k) {
  const set = new Set();
  svc.masters.map(M).filter(Boolean).forEach(m => { const s = m.services.find(x => x.name.trim().toLowerCase() === svc.name.trim().toLowerCase()); if (s) slotsFor(m, k, s.dur).forEach(t => set.add(t)); });
  return [...set].sort();
}
function renderSalonSheet() {
  const sl = SAL(sb.sid), svcs = salonServices(sl), svc = sb.i >= 0 ? svcs[sb.i] : null;
  const step = !svc ? 1 : !sb.t ? 2 : 3;
  const bar = `<div class="steps">${[1, 2, 3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
  let h = '';
  if (step === 1) h = `<h2>Что делаем?</h2><div class="card" style="padding:4px 16px;margin-top:14px">${svcs.map((s, i) => `<button class="svc" data-a="sbSvc" data-v="${i}"><div><b>${esc(s.name)}</b><p class="muted small">${s.dur} мин</p></div><span class="price">от ${money(Math.min(...s.prices))}</span></button>`).join('')}</div>`;
  if (step === 2) {
    const days = []; for (let i = 0; i < 14; i++) { const kk = dkey(addDays(today(), i)); days.push({ kk, n: salonSlots(sl, svc, kk).length }); }
    if (!sb.k) { const f = days.find(d => d.n); sb.k = f ? f.kk : null; }
    const sl2 = sb.k ? salonSlots(sl, svc, sb.k) : [];

    <div class="days">${days.map(d => { const x = fromKey(d.kk); return `<button class="day ${sb.k === d.kk ? 'on' : ''}" data-a="sbDay" data-v="${d.kk}" ${d.n ? '' : 'disabled'}><span>${WDS[x.getDay()]}</span><b>${x.getDate()}</b></button>`; }).join('')}</div>
    <p class="small muted" style="margin:16px 0 10px;font-weight:600">${sb.k ? human(sb.k) : 'Свободных окон нет'}</p>
    ${sl2.length ? `<div class="grid">${sl2.map(t => `<button class="slot" data-a="sbTime" data-v="${t}">${t}</button>`).join('')}</div>` : ''}`;
  }
  if (step === 3) {
    const free = svc.masters.map(M).filter(m => { const s = m.services.find(x => x.name.trim().toLowerCase() === svc.name.trim().toLowerCase()); return s && slotsFor(m, sb.k, s.dur).includes(sb.t); });
    h = `<h2>Всё верно?</h2><div class="card" style="margin-top:14px"><div class="sum"><span class="muted">Салон</span><b>${esc(sl.name)}</b></div><div class="sum"><span class="muted">Услуга</span><b>${esc(svc.name)}</b></div><div class="sum"><span class="muted">Когда</span><b>${shortDay(sb.k)}, ${sb.t}</b></div><div class="sum"><span class="muted">Мастер</span><b>${free.length > 1 ? 'любой свободный' : esc((free[0] || {}).name || '')}</b></div></div>
    ${free.length > 1 ? `<p class="small muted" style="margin-top:10px">Свободны: ${free.map(m => esc(m.name)).join(', ')}. Хочешь к конкретному мастеру — выбери его на странице салона</p>` : ''}
    ${S.me.consent ? '' : `<label class="consent"><input type="checkbox" id="sbAgree"><span>${CONSENT}</span></label>`}
    <div class="row" style="margin-top:18px"><button class="btn ghost" data-a="sbBack">Назад</button><button class="btn" data-a="sbOk">Записаться на ${sb.t}</button></div>`;
  }

}

}

/* ---------- афиша: даты, категории, языки ---------- */
let afD = 'all', afK = 'all';
const KINDS = [['workshop', 'Воркшопы'], ['meetup', 'Встречи'], ['sport', 'Спорт'], ['food', 'Еда'], ['tour', 'Экскурсии'], ['art', 'Искусство'], ['other', 'Другое']];
const kindOf = e => e.kind || (e.tourist ? 'tour' : 'workshop');
const langBadges = e => (e.langs || []).map(l => `<span class="tag lang">${{ ru: 'RU', en: 'EN', hy: 'HY' }[l] || l}</span>`).join('');
function dateOk(e) {
  const t = today(), d = fromKey(e.date), diff = Math.round((d - t) / 864e5);
  if (afD === 'today') return diff === 0;
  if (afD === 'tmr') return diff === 1;
  if (afD === 'wknd') return diff >= 0 && diff < 7 && (d.getDay() === 6 || d.getDay() === 0);
  return true;
}
VIEWS.afisha = () => {

    .sort((a, b) => S.me.tourist ? ((kindOf(b) === 'tour') - (kindOf(a) === 'tour')) || (((b.langs || []).includes('en')) - ((a.langs || []).includes('en'))) || (a.date + a.time).localeCompare(b.date + b.time) : (a.date + a.time).localeCompare(b.date + b.time));
  return `${topBar()}<div class="hello"><h1>Афиша</h1><p class="muted">Воркшопы, встречи и прогулки от людей города</p></div>

  <div class="stack" style="margin-top:12px">${list.map(evCard).join('') || '<div class="empty"><h2>Ничего не нашли</h2><p class="muted">Попробуй другую дату или категорию</p></div>'}</div>`;
};

/* ---------- ссылки из бота и Telegram ---------- */
function deepLink2() {
  const q = new URLSearchParams(location.search);
  let sp = ''; try { sp = (W && W.initDataUnsafe && W.initDataUnsafe.start_param) || ''; } catch (e) {}
  const pm = sp.match(/^([mesj])_([\w-]+)$/);
  const get = k => q.get(k) || (pm && { master: 'm', event: 'e', salon: 's', join: 'j' }[k] === pm[1] ? pm[2] : null);
  if (get('join')) return joinFlow(get('join'));
  if (q.get('salonadmin') && S.mySalon) { S.role = 'master'; save(); hist = []; view = { name: 'salonAdmin' }; return render(); }
  if (!S.me.joined && S.role !== 'master') return;

/* ================= КАРТА «РЯДОМ СО МНОЙ» ================= */
let myLoc = null, nearCat = 'all', nearView = null, locating = false;
const kmBetween = (a, b) => { const R = 6371, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng); const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const distText = km => km < 1 ? `${Math.round(km * 1000 / 10) * 10} м · ${Math.max(1, Math.round(km * 12))} мин пешком` : km < 3 ? `${km.toFixed(1).replace('.', ',')} км · ${Math.round(km * 12)} мин пешком` : `${km.toFixed(1).replace('.', ',')} км`;
function slotsInWindow(m, n) {
  const days = whenDays(), dur = (m.services[0] || { dur: 60 }).dur;
  if (!days) return nearest(m, n);
  const out = [];
  for (const d of days) { slotsFor(m, d.k, dur).filter(t => toMin(t) >= d.from).forEach(t => { if (out.length < n) out.push({ k: d.k, t }); }); if (out.length >= n) break; }
  return out;
}
function nearItems() {
  const items = []; let noCoords = 0;
  (S.salons || []).filter(sl => !sl.status || sl.status === 'approved').forEach(sl => {
    const ms = salonMembers(sl); if (!ms.length) return;
    if (nearCat !== 'all' && sl.cat !== nearCat && !ms.some(m => m.cat === nearCat)) return;
    if (!sl.lat) { noCoords++; return; }
    const first = salonFirstSlot(sl); if (when !== 'any' && !first) return;
    items.push({ type: 'salon', id: sl.id, name: sl.name, sub: `Салон · ${ms.length} ${plural(ms.length, 'мастер', 'мастера', 'мастеров')}`, lat: sl.lat, lng: sl.lng, photo: (sl.photos || [])[0], first, slots: [] });
  });
  S.masters.filter(m => pub(m) && m.id !== S.myMasterId && !(m.salonId && SAL(m.salonId))).forEach(m => {
    if (nearCat !== 'all' && m.cat !== nearCat) return;
    if (!m.lat) { noCoords++; return; }
    const slots = slotsInWindow(m, 3); if (when !== 'any' && !slots.length) return;
    items.push({ type: 'master', id: m.id, name: m.name, sub: catOf(m.cat).name + (m.rating ? ` · ★ ${m.rating}` : ''), lat: m.lat, lng: m.lng, m, first: slots[0] || null, slots });
  });
  if (myLoc) items.forEach(it => it.dist = kmBetween(myLoc, it));
  items.sort((a, b) => myLoc ? a.dist - b.dist : ((a.first ? a.first.k + a.first.t : 'z') < (b.first ? b.first.k + b.first.t : 'z') ? -1 : 1));
  return { items, noCoords };
}
VIEWS.nearby = () => {
  const { items, noCoords } = nearItems();
  return `${topBar()}<div class="hello"><h1>Рядом со мной</h1><p class="muted">Мастера и салоны на карте со свободными окнами</p></div>
  <div class="chips" style="margin-top:14px">${WHEN.map(([k, t]) => `<button class="chip ${when === k ? 'on' : ''}" data-a="whenSet" data-v="${k}">${t}</button>`).join('')}</div>
  <div class="chips"><button class="chip ${nearCat === 'all' ? 'on' : ''}" data-a="nearCat" data-v="all">Все</button>${CATS.map(c => `<button class="chip ${nearCat === c.id ? 'on' : ''}" data-a="nearCat" data-v="${c.id}">${c.name}</button>`).join('')}</div>
  <div class="bigmap" id="nearMap" data-near="1"></div>
  <div class="locbar">${myLoc ? `<span class="small muted">Показываем по расстоянию от тебя. Геопозиция не покидает телефон</span><button class="link small" data-a="nearLocate">Обновить</button>` : `<button class="btn small" data-a="nearLocate" ${locating ? 'disabled' : ''}>${locating ? 'Ищу тебя…' : 'Показать, что рядом со мной'}</button>`}</div>
  <div class="stack" style="margin-top:12px">${items.map(it => `<div class="card near"><button class="mcard" data-a="${it.type}" data-id="${it.id}">${it.type === 'salon' ? (it.photo ? `<div class="ava ph" style="background-image:url('${it.photo}')"></div>` : `<div class="ava" style="background:var(--accent)">${esc(it.name[0])}</div>`) : ava(it.m)}<div class="body"><h3>${esc(it.name)}</h3><p class="meta">${esc(it.sub)}</p>${it.dist !== undefined ? `<p class="meta">${distText(it.dist)}</p>` : ''}</div></button>
    ${it.type === 'master' ? (it.slots.length ? `<div class="chips" style="margin-top:10px">${it.slots.map(n => `<button class="slot" data-a="quick" data-id="${it.id}" data-k="${n.k}" data-t="${n.t}"><small>${shortDay(n.k)}</small>${n.t}</button>`).join('')}</div>` : '<p class="small muted" style="margin-top:8px">Свободных окон пока нет</p>') : (it.first ? `<div class="chips" style="margin-top:10px"><button class="slot" data-a="salon" data-id="${it.id}"><small>${shortDay(it.first.k)}</small>${it.first.t}</button><button class="slot" data-a="salon" data-id="${it.id}" style="background:var(--bg)"><small>все мастера</small>Выбрать</button></div>` : '')}</div>`).join('') || `<div class="empty"><h2>Рядом ничего не нашли</h2><p class="muted">Попробуй другое время или категорию</p></div>`}</div>
  ${noCoords ? `<p class="small muted" style="margin-top:14px;text-align:center">Ещё ${noCoords} ${plural(noCoords, 'мастер', 'мастера', 'мастеров')} без точки на карте — они есть в <button class="link small" data-a="tab" data-v="home">каталоге</button></p>` : ''}`;
};
function locateMe() {
  return new Promise((res, rej) => {
    const geo = () => {
      if (!navigator.geolocation) return rej(new Error('Геопозиция недоступна на этом устройстве'));
      navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => rej(new Error('Разреши доступ к геопозиции, чтобы увидеть, что рядом')), { timeout: 12000, maximumAge: 60000 });
    };
    const LM = TG && W.LocationManager;
    if (LM && typeof LM.init === 'function') {
      try {
        LM.init(() => {
          if (!LM.isLocationAvailable) return geo();
          LM.getLocation(d => d ? res({ lat: d.latitude, lng: d.longitude }) : (LM.isAccessRequested && !LM.isAccessGranted ? rej(new Error('Доступ к геопозиции выключен — включи его в настройках бота')) : rej(new Error('Не удалось определить, где ты'))));
        });
        return;
      } catch (e) { return geo(); }
    }
    geo();
  });
}
async function mountNear(el) {
  const ok = await loadLeaflet();
  if (!ok || !window.L) { el.innerHTML = '<p class="small muted" style="padding:14px">Карта не загрузилась — список ниже работает</p>'; return; }
  const { items } = nearItems();
  const center = nearView ? nearView.c : myLoc ? [myLoc.lat, myLoc.lng] : [40.1792, 44.4991];
  const map = L.map(el, { attributionControl: true, zoomControl: true }).setView(center, nearView ? nearView.z : myLoc ? 15 : 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const pts = [];
  items.forEach(it => {
    const salon = it.type === 'salon';
    const mk = L.circleMarker([it.lat, it.lng], { radius: salon ? 11 : 9, color: '#fff', weight: 3, fillColor: salon ? '#8E1F3A' : '#E08A2E', fillOpacity: 1 }).addTo(map);
    mk.bindPopup(`<div class="pop"><b>${esc(it.name)}</b><br><span>${esc(it.sub)}</span>${it.first ? `<br><span>Ближайшее окно: ${shortDay(it.first.k).toLowerCase()} в ${it.first.t}</span>` : ''}${it.dist !== undefined ? `<br><span>${distText(it.dist)}</span>` : ''}<br><button class="btn small" style="margin-top:8px;width:100%" data-a="${it.type}" data-id="${it.id}">Открыть</button></div>`);
    pts.push([it.lat, it.lng]);
  });
  if (myLoc) { L.circleMarker([myLoc.lat, myLoc.lng], { radius: 8, color: '#fff', weight: 3, fillColor: '#2F6FED', fillOpacity: 1 }).addTo(map).bindTooltip('Ты здесь'); pts.push([myLoc.lat, myLoc.lng]); }
  if (!nearView && pts.length > 1) map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
  map.on('moveend', () => { nearView = { c: [map.getCenter().lat, map.getCenter().lng], z: map.getZoom() }; });
  setTimeout(() => map.invalidateSize(), 250);
}
Object.assign(EXTRA, {
  nearCat: (el, id, v) => { nearCat = v; render(); },
  nearLocate: async () => {
    locating = true; render();
    try { myLoc = await locateMe(); nearView = null; toast('Нашли тебя на карте'); } catch (e) { toast(e.message); }
    locating = false; render();
  }
});

if (S.role === 'master') view = { name: 'cab' };
render();
