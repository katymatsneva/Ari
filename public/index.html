<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Ari — запись к мастерам Еревана</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4E9E4; --card:#FFFFFF; --ink:#231A1E; --muted:#7A6A6E; --line:#E6D6CF;
  --accent:#8E1F3A; --accent-ink:#FFFFFF; --apricot:#F4B26B; --apricot-soft:#FBE3C6; --ok:#2F7A4F;
  --shadow:0 1px 0 rgba(35,26,30,.04), 0 8px 24px -12px rgba(35,26,30,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1417; --card:#251D21; --ink:#F4E9E4; --muted:#B3A3A7; --line:#3A2E33;
    --accent:#E0607A; --accent-ink:#1A1417; --apricot:#F4B26B; --apricot-soft:#3D2E22; --ok:#6FCF97;
    --shadow:0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1417; --card:#251D21; --ink:#F4E9E4; --muted:#B3A3A7; --line:#3A2E33;
  --accent:#E0607A; --accent-ink:#1A1417; --apricot:#F4B26B; --apricot-soft:#3D2E22; --ok:#6FCF97;
  --shadow:0 8px 24px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
img{max-width:100%}
.app{max-width:480px;margin:0 auto;padding:0 18px 110px}
h1,h2,h3{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:26px;line-height:1.15}
h2{font-size:19px;line-height:1.2}
h3{font-size:16px;line-height:1.25;font-weight:500}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.logo{font-family:"Unbounded",sans-serif;font-weight:700;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.role{font-size:14px;font-weight:500;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
.back{display:flex;align-items:center;gap:6px;font-weight:500;padding:6px 0}

/* chips & buttons */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);font-size:14px;font-weight:500;border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot{flex:none;padding:10px 14px;border-radius:14px;background:var(--apricot-soft);font-weight:600;font-size:15px;border:1.5px solid transparent;text-align:center}
.slot small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.slot.on{border-color:var(--accent);background:var(--card)}
.slot[disabled]{opacity:.35;cursor:default}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:10px 14px;border-radius:14px;font-size:14px;width:auto}
.row{display:flex;gap:10px}
.row>*{flex:1}
.link{color:var(--accent);font-weight:500}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.ava{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-family:"Unbounded",sans-serif;font-weight:700;font-size:20px;color:#fff}
.ava.xl{width:88px;height:88px;border-radius:28px;font-size:32px}
.mcard{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%}
.mcard .body{flex:1;min-width:0}
.mcard .meta{font-size:14px;color:var(--muted);margin-top:2px}
.mcard .next{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;background:var(--apricot-soft);padding:5px 10px;border-radius:10px}
.star{color:var(--apricot)}

/* hello */
.hello{padding:8px 0 4px}
.hello p{margin-top:6px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin:18px 0 12px;border:1px solid var(--line)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px}
.again{display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:22px;padding:16px;margin-top:18px}
.again .btn{background:var(--apricot);color:#231A1E;width:auto;padding:10px 14px;border-radius:14px;font-size:14px}

/* service list */
.svc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.svc:first-child{border-top:0}
.svc b{font-weight:600}
.price{font-weight:600;white-space:nowrap}

/* events */
.ev{display:flex;gap:14px;text-align:left;width:100%}
.date{flex:none;width:58px;border-radius:16px;background:var(--apricot-soft);text-align:center;padding:8px 0}
.date b{display:block;font-family:"Unbounded",sans-serif;font-size:22px;line-height:1.1}
.date span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--bg);color:var(--muted)}
.tag.hot{background:var(--accent);color:var(--accent-ink)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);z-index:10}
.tabs .in{max-width:480px;margin:0 auto;display:flex}
.tab{flex:1;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(20,12,16,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.sheet .in{max-width:480px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--accent)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:54px;padding:10px 0;border-radius:16px;background:var(--card);text-align:center;border:1.5px solid transparent}
.day b{display:block;font-size:18px;font-family:"Unbounded",sans-serif}
.day span{font-size:12px;color:var(--muted)}
.day.on{border-color:var(--accent)}
.day[disabled]{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.note{background:var(--apricot-soft);border-radius:16px;padding:12px 14px;font-size:14px}
.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.sum:last-child{border-bottom:0}

/* done */
.done{text-align:center;padding-top:30px}
.check{width:84px;height:84px;border-radius:50%;background:var(--accent);margin:0 auto 20px;display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.check svg{width:40px;height:40px;stroke:var(--accent-ink);stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .25s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.ticket{background:var(--card);border-radius:24px;margin:24px 0 16px;text-align:left;box-shadow:var(--shadow);overflow:hidden}
.ticket .t1{padding:18px}
.ticket .t2{padding:14px 18px;border-top:2px dashed var(--line);display:flex;justify-content:space-between;font-size:14px}
.ticket .big{font-family:"Unbounded",sans-serif;font-size:24px;margin-top:6px}
.bot{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border-radius:18px;padding:12px 14px;font-size:14px;border:1px solid var(--line)}

/* master cabinet */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:"Unbounded",sans-serif;font-size:24px}
.stat span{font-size:12px;color:var(--muted);line-height:1.2;display:block;margin-top:4px}
.bk{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0}
.bk .tm{font-family:"Unbounded",sans-serif;font-weight:500;width:56px;flex:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--card);border-radius:18px;padding:16px 14px;text-align:left;font-weight:600;box-shadow:var(--shadow);font-size:15px}
.act span{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.dtog{display:flex;gap:6px}
.dtog button{flex:1;padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.dtog button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tmpl{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.tmpl:first-child{border-top:0}
.tmpl input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.tmpl .nm{flex:1}
.tmpl input[type=number]{width:96px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:right}
.story{aspect-ratio:9/16;max-width:220px;margin:0 auto;border-radius:24px;background:var(--accent);color:var(--accent-ink);padding:22px 18px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:var(--shadow)}
.story .logo{font-size:15px}
.story .logo i{background:var(--apricot)}
.story h2{font-size:22px}
.story .cta{background:var(--apricot);color:#231A1E;border-radius:14px;padding:10px 12px;font-weight:600;font-size:14px;text-align:center}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.empty{text-align:center;padding:36px 18px}
.empty p{margin:8px 0 18px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:30;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.proto{font-size:12px;color:var(--muted);text-align:center;margin-top:34px}
.ava.ph{background-size:cover;background-position:center;color:transparent}
.hero{margin:6px -18px 0;height:260px;background-size:cover;background-position:center 30%;border-radius:0 0 32px 32px;position:relative}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(to bottom,transparent 55%,rgba(20,12,16,.35))}
.upload{display:flex;gap:14px;align-items:center}
.upload .ava{cursor:pointer}
.tg{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 8px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:14px;text-align:left}
.consent input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.cta-bar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin:24px -18px 0;padding:18px 18px 14px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.plan{border:2px solid var(--line);border-radius:22px;padding:18px;background:var(--card)}
.plan.on{border-color:var(--accent)}
.plan .pr{font-family:"Unbounded",sans-serif;font-size:24px;margin:6px 0 10px}
.plan li{margin:4px 0;font-size:14px}
.plan ul{padding-left:18px;margin:0}
.meter{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent)}
.doc{display:block;width:100%;text-align:left;padding:14px 0;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.bell{position:relative;width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.bell svg{width:20px;height:20px}
.bell.dot::after{content:"";position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
.topr{display:flex;gap:8px;align-items:center}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bub{max-width:86%;padding:12px 14px;border-radius:20px 20px 20px 6px;background:var(--card);box-shadow:var(--shadow);animation:rise .3s ease-out both}
.bub.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:var(--accent);color:var(--accent-ink)}
.bub .when{display:block;font-size:11px;color:var(--muted);margin-top:6px;text-align:right}
.bub.me .when{color:inherit;opacity:.7}
.bub .kb{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bub .kb button,.bub .kb a{flex:1;min-width:90px;padding:9px 10px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:600;text-align:center;color:var(--accent);text-decoration:none}
.bub .kb .done{color:var(--ok);background:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.pick{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pick button{padding:14px 16px;border-radius:16px;background:var(--card);text-align:left;font-weight:600;border:1.5px solid var(--line)}
.pick button span{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.idcard{border-radius:26px;padding:22px;background:var(--ink);color:var(--bg);text-align:left;position:relative;overflow:hidden;margin:18px 0}
.idcard::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--accent);opacity:.9}
.idcard::after{content:"";position:absolute;right:30px;top:60px;width:70px;height:70px;border-radius:50%;background:var(--apricot)}
.idcard .no{font-family:"Unbounded",sans-serif;font-size:13px;opacity:.7;position:relative}
.idcard h2{font-size:24px;margin:40px 0 4px;position:relative}
.idcard p{position:relative;opacity:.75;font-size:14px}
.tours{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 8px;scrollbar-width:none}
.tours::-webkit-scrollbar{display:none}
.tour{flex:none;width:230px;border-radius:22px;padding:16px;background:#1F6F8B;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:150px}
.tour h3{margin-top:6px}
.tour span{font-size:13px;opacity:.85}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--ok);margin-top:10px}
.sched{font-size:14px;padding:10px 0;border-top:1px solid var(--line);display:flex;gap:12px}
.sched:first-child{border-top:0}
.sched b{flex:none;width:112px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.check svg{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDS = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const money = n => n ? Number(n).toLocaleString('ru-RU') + ' ֏' : 'Бесплатно';
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const toTime = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
function human(k) {
  const d = fromKey(k), t = today(), diff = Math.round((d - t) / 864e5);
  const base = d.getDate() + ' ' + MON[d.getMonth()];
  if (diff === 0) return 'Сегодня, ' + base;
  if (diff === 1) return 'Завтра, ' + base;
  return WD[d.getDay()][0].toUpperCase() + WD[d.getDay()].slice(1) + ', ' + base;
}
function shortDay(k) {
  const d = fromKey(k), diff = Math.round((d - today()) / 864e5);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Завтра';
  return WDS[d.getDay()] + ', ' + d.getDate() + ' ' + MONS[d.getMonth()];
}
function plural(n, a, b, c) { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2200); }

const ICON = {

function slotsFor(m, key, dur, ignoreId) {
  const d = fromKey(key);
  if (!m.schedule.days.includes(d.getDay())) return [];
  const busy = S.bookings.filter(b => b.masterId === m.id && b.date === key && active(b) && b.id !== ignoreId && !b.eventId)
    .map(b => [toMin(b.time), toMin(b.time) + (b.dur || 60)]);
  S.events.filter(e => e.masterId === m.id && e.date === key).forEach(e => busy.push([toMin(e.time), toMin(e.time) + e.dur]));
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes() + 60;
  const out = [];
  for (let s = m.schedule.from * 60; s + dur <= m.schedule.to * 60; s += 60) {
    if (key === dkey(today()) && s < nowMin) continue;
    if (busy.some(([a, b]) => s < b && s + dur > a)) continue;
    out.push(toTime(s));
  }
  return out;
}

}

  master() {

    <div class="sec"><div class="sec-h"><h2>Ближайшие окна</h2></div>

    <div class="stack" style="margin-top:12px">${list.map(evCard).join('') || '<div class="empty"><h2>Пока пусто</h2><p class="muted">Скоро здесь появятся события</p></div>'}</div>`;
  },

  event() {

  mine() {
    const my = S.bookings.filter(b => b.mine && active(b));
    const up = my.filter(b => !isPast(b)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const past = my.filter(isPast).sort((a, b) => b.date.localeCompare(a.date));

    ${past.length ? `<div class="sec"><div class="sec-h"><h2>Были раньше</h2></div><div class="stack">${past.map(b => card(b, true)).join('')}</div></div>` : ''}`;
  },

  done() {
    const b = S.bookings.find(x => x.id === view.id); if (!b) return VIEWS.mine();
    const m = M(b.masterId), e = b.eventId && E(b.eventId), s = !e && svcOf(m, b.serviceId);
    const title = e ? e.title : s.name, dur = e ? e.dur : s.dur;
    const st = b.date.replace(/-/g, '') + 'T' + b.time.replace(':', '') + '00', en = b.date.replace(/-/g, '') + 'T' + toTime(toMin(b.time) + dur).replace(':', '') + '00';
    const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title + ' — ' + m.name) + '&dates=' + st + '/' + en + '&location=' + encodeURIComponent('Ереван, ' + (m.address || m.area));
    const map = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Yerevan ' + (m.address || m.area));
    return `<div class="done"><div class="check">${ICON.check}</div><h1>${view.moved ? 'Перенесли' : e ? 'Вы идёте' : 'Вы записаны'}</h1><p class="muted" style="margin-top:8px">${esc(m.name.split(' ')[0])} ждёт вас</p>
    <div class="ticket"><div class="t1"><p class="muted small">${esc(title)}</p><div class="big">${human(b.date)}</div><div class="big" style="color:var(--accent)">${b.time}</div></div>

  /* ---------- master side ---------- */
  cab() {

    const mine = S.bookings.filter(b => b.masterId === m.id && active(b) && !isPast(b)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    ${m.status === 'rejected' ? `<div class="note" style="margin-top:14px"><b>Нужно поправить:</b> ${esc(m.rejectReason || '')}<br><button class="link" data-a="editSvc">Исправить профиль</button> — после сохранения страница снова уйдёт на проверку.</div>` : ''}

    </div>
    <div class="sec"><div class="sec-h"><h2>Ближайшие записи</h2></div>

    }).join('')}</div>`).join('') : `<div class="empty card"><h2>Записей пока нет</h2><p class="muted">Поделитесь своей страницей в сторис — клиенты запишутся сами</p><button class="btn" data-a="story">Показать карточку для сторис</button></div>`}</div>
    <p class="proto">Прототип. Чтобы проверить путь целиком, переключитесь на «Я клиент» и запишитесь к себе. ${LIVE ? '' : '<button class="link" data-a="reset">Сбросить</button>'}</p>`;
  }
};

  if (ob.step === 4) { ob.address = g('obAddr').trim(); const p = g('obPreAmt'); if (p !== undefined) ob.prepay = +p || 0; const pi = g('obPay'); if (pi !== undefined) ob.payInfo = pi.trim(); const ag = document.getElementById('obAgree'); if (ag) ob.agree = ag.checked; const lg = g('obLangs'); if (lg !== undefined) ob.langs = lg.trim(); }
}
function obNext() {
  obSaveFields();
  if (ob.step === 1) {
    if (!ob.name) return toast('Напишите, как вас зовут');
    if (!ob.cat) return toast('Выберите, чем занимаетесь');
    if (!ob.svcs.length || ob.svcs.cat !== ob.cat) { ob.svcs = TEMPLATES[ob.cat].map(([name, dur, price], i) => ({ name, dur, price, on: i < 2 })); ob.svcs.cat = ob.cat; }
  }
  if (ob.step === 2 && !ob.svcs.some(s => s.on)) return toast('Отметьте хотя бы одну услугу');
  if (ob.step === 3) { if (!ob.days.length) return toast('Выберите рабочие дни'); if (ob.to - ob.from < 1) return toast('Проверьте часы работы'); }
  if (ob.step === 4) {
    if (!ob.agree) return toast('Нужно принять оферту');
    if (ob.prepayOn && /\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}/.test(ob.payInfo)) return toast('Не указывайте номер карты — лучше Idram, Telcell или ссылку');
    const m = { id: 'my_' + uid(), name: ob.name, cat: ob.cat, about: ob.about, area: ob.area, address: ob.address, prepay: ob.prepayOn ? ob.prepay : 0, payInfo: ob.prepayOn ? ob.payInfo : '', photo: ob.photo, plan: 'free', langs: ob.langs || '', registry: !!ob.registry,
      services: ob.svcs.filter(s => s.on).map(s => ({ id: uid(), name: s.name, dur: s.dur, price: s.price })), schedule: { days: ob.days.slice(), from: ob.from, to: ob.to }, rating: 0, reviews: 0, isMine: true };
    S.masters.unshift(m); S.myMasterId = m.id; if (!S.me.name) S.me.name = ob.name; save();
  }
  ob.step++; render(); window.scrollTo(0, 0);
}

/* ---------- booking sheet ---------- */
let bk = null;
function openSheet(html) { $('#sheetIn').innerHTML = '<div class="grab"></div>' + html; $('#veil').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet() { $('#veil').classList.remove('on'); $('#sheet').classList.remove('on'); bk = null; }
function startBooking(mId, sId, k, t, moveId) {
  const m = M(mId);
  bk = { mId, sId: sId || (m.services.length === 1 ? m.services[0].id : null), k: k || null, t: t || null, moveId: moveId || null };
  if (!bk.k && bk.sId) { const s = svcOf(m, bk.sId); for (let i = 0; i < 21; i++) { const kk = dkey(addDays(today(), i)); if (slotsFor(m, kk, s.dur, moveId).length) { bk.k = kk; break; } } }
  renderSheet();
}
function renderSheet() {
  const m = M(bk.mId), s = bk.sId && svcOf(m, bk.sId);
  const step = !s ? 1 : (!bk.t ? 2 : 3);
  const bar = `<div class="steps">${[1,2,3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;
  let h = '';
  if (step === 1) h = `<h2>Что делаем?</h2><div class="card" style="padding:4px 16px;margin-top:14px">${m.services.map(x => `<button class="svc" data-a="bkSvc" data-v="${x.id}"><div><b>${esc(x.name)}</b><p class="muted small">${x.dur} мин</p></div><span class="price">${money(x.price)}</span></button>`).join('')}</div>`;
  if (step === 2) {
    const days = []; for (let i = 0; i < 14; i++) { const kk = dkey(addDays(today(), i)); days.push({ kk, n: slotsFor(m, kk, s.dur, bk.moveId).length }); }
    const sl = bk.k ? slotsFor(m, bk.k, s.dur, bk.moveId) : [];
    h = `<h2>${bk.moveId ? 'Новое время' : 'Когда удобно?'}</h2><p class="muted small" style="margin:4px 0 14px">${esc(s.name)}, ${s.dur} мин${m.services.length > 1 && !bk.moveId ? ' <button class="link" data-a="bkChg">изменить</button>' : ''}</p>
    <div class="days">${days.map(d => { const x = fromKey(d.kk); return `<button class="day ${bk.k === d.kk ? 'on' : ''}" data-a="bkDay" data-v="${d.kk}" ${d.n ? '' : 'disabled'}><span>${WDS[x.getDay()]}</span><b>${x.getDate()}</b></button>`; }).join('')}</div>
    <p class="small muted" style="margin:16px 0 10px;font-weight:600">${bk.k ? human(bk.k) : 'Выберите день'}</p>
    ${sl.length ? [['Утро', 0, 12], ['День', 12, 17], ['Вечер', 17, 24]].map(([n, a, b]) => { const g = sl.filter(t => +t.slice(0, 2) >= a && +t.slice(0, 2) < b); return g.length ? `<p class="tg">${n}</p><div class="grid">${g.map(t => `<button class="slot" data-a="bkTime" data-v="${t}">${t}</button>`).join('')}</div>` : ''; }).join('') : '<p class="muted">В этот день окон нет</p>'}`;
  }
  if (step === 3) {
    const need = !S.me.name || !S.me.phone;
    h = `<h2>${bk.moveId ? 'Переносим?' : 'Всё верно?'}</h2><div class="card" style="margin-top:14px">
      <div class="sum"><span class="muted">Мастер</span><b>${esc(m.name)}</b></div>
      <div class="sum"><span class="muted">Услуга</span><b>${esc(s.name)}</b></div>
      <div class="sum"><span class="muted">Когда</span><b>${shortDay(bk.k)}, ${bk.t}</b></div>
      <div class="sum"><span class="muted">Стоимость</span><b>${money(s.price)}</b></div></div>
      ${need ? `<div class="stack" style="margin-top:14px"><p class="small muted">Один раз — чтобы мастер знал, кого ждать. В Telegram это заполнится само</p><div class="field"><input id="meName" placeholder="Ваше имя" value="${esc(S.me.name)}" autocomplete="given-name"></div><div class="field"><input id="mePhone" type="tel" placeholder="+374 ..." value="${esc(S.me.phone)}" autocomplete="tel"></div></div>` : `<p class="small muted" style="margin-top:12px">${esc(S.me.name)}, ${esc(S.me.phone)}</p>`}
      ${m.prepay && !bk.moveId ? `<div class="note" style="margin-top:14px">Предоплата ${money(m.prepay)} переводится напрямую мастеру. Бесплатная отмена за 24 часа до визита.</div>` : ''}
      ${S.me.consent ? '' : `<label class="consent"><input type="checkbox" id="bkAgree"><span>${CONSENT}</span></label>`}
      <div class="row" style="margin-top:18px"><button class="btn ghost" data-a="bkBack">Назад</button><button class="btn" data-a="bkOk">${bk.moveId ? 'Перенести' : 'Записаться'}</button></div>`;
  }
  openSheet(bar + h);
}
function confirmBooking() {
  const n = document.getElementById('meName'), p = document.getElementById('mePhone');
  if (n) { if (!n.value.trim()) return toast('Как вас зовут?'); S.me.name = n.value.trim(); }
  if (p) { if (p.value.replace(/\D/g, '').length < 8) return toast('Проверьте номер телефона'); S.me.phone = p.value.trim(); }
  const ag = document.getElementById('bkAgree'); if (ag) { if (!ag.checked) return toast('Нужно ваше согласие на обработку данных'); S.me.consent = new Date().toISOString(); }
  const m = M(bk.mId), s = svcOf(m, bk.sId);
  if (!slotsFor(m, bk.k, s.dur, bk.moveId).includes(bk.t)) { toast('Это время только что заняли'); bk.t = null; return renderSheet(); }
  let id, moved = false;
  if (bk.moveId) { const b = S.bookings.find(x => x.id === bk.moveId); b.date = bk.k; b.time = bk.t; b.movedAt = new Date().toISOString(); b.confirmed = false; id = b.id; moved = true; }
  else { id = uid(); S.bookings.push({ id, masterId: m.id, serviceId: s.id, date: bk.k, time: bk.t, dur: s.dur, clientName: S.me.name, mine: true, status: 'active', source: view.name === 'event' ? 'afisha' : 'catalog', createdAt: new Date().toISOString() }); }
  save(); closeSheet(); go({ name: 'done', id, moved });
}

    complainGo: () => needJoin(async () => { closeSheet(); try { await api('POST', '/api/complaints', { type: el.dataset.t, id, reason: COMPLAINTS[+v] }); toast('Спасибо, мы проверим'); } catch (e) { toast(e.message); } }),
    tgPhone: () => W.requestContact(ok => { if (!ok) return toast('Можно ввести номер вручную'); toast('Секунду…'); setTimeout(async () => { try { await sync(); } catch (e) {} if (S.me.phone) { wz.step = 4; render(); } else toast('Номер не дошёл — введите вручную'); }, 1500); }),
    delMe: () => openSheet(`<h2>Удалить все данные?</h2><p class="muted" style="margin:8px 0 18px">Будущие записи отменятся, мастера получат уведомление. Страница мастера тоже удалится. Отменить это нельзя</p><div class="row"><button class="btn ghost" data-a="close">Оставить</button><button class="btn" data-a="delOk">Удалить</button></div>`),
    delOk: async () => { closeSheet(); try { await api('DELETE', '/api/me'); S.me = { name: '', phone: '' }; ob = null; wz.step = 1; S.role = 'client'; hist = []; view = { name: 'home' }; await sync(); toast('Данные удалены'); } catch (e) { toast(e.message); } },

    docs: () => { closeSheet(); go({ name: 'docs' }); },
    payPro: () => openSheet(`<h2>Подключить Pro</h2><div class="card" style="margin-top:14px"><div class="sum"><span class="muted">Тариф</span><b>Pro, 1 месяц</b></div><div class="sum"><span class="muted">Сумма</span><b>${money(PRO_PRICE)}</b></div><div class="sum"><span class="muted">Получатель</span><b>ИП (реквизиты после регистрации)</b></div></div>
      <p class="tg">Способ оплаты</p><div class="chips"><button class="chip on">Карта</button><button class="chip">Idram</button><button class="chip">Telcell</button></div>
      <p class="small muted" style="margin-top:12px">Электронный чек придёт на почту сразу после оплаты</p><button class="btn" style="margin-top:16px" data-a="proOk">Оплатить ${money(PRO_PRICE)}</button>`),
    proOk: () => { if (LIVE) { closeSheet(); return toast('Онлайн-оплата подписки появится после регистрации ИП'); } M(S.myMasterId).plan = 'pro'; save(); closeSheet(); render(); toast('Pro подключён. В прототипе деньги не списываются'); },
    edDay: () => { el.classList.toggle('on'); },
    edOk: () => {
      const m = M(S.myMasterId);
      document.querySelectorAll('[data-ep]').forEach(i => { m.services[+i.dataset.ep].price = +i.value || 0; });
      const days = [...document.querySelectorAll('#edDays button')].map((b, i) => b.classList.contains('on') ? [1,2,3,4,5,6,0][i] : null).filter(x => x !== null);
      if (!days.length) return toast('Нужен хотя бы один рабочий день');
      const f = +$('#edF').value, t = +$('#edT').value; if (t <= f) return toast('Проверьте часы работы');
      m.about = $('#edAbout').value.trim().slice(0, 400);
      m.schedule = { days, from: f, to: t }; save(); closeSheet(); render(); toast(LIVE && m.status === 'rejected' ? 'Сохранено и отправлено на проверку' : 'Сохранено');
    }
  }[a];
  if (act) act();
});

if (S.role === 'master') view = { name: 'cab' };
render();
if (TG) {
  W.ready(); W.expand();
  const theme = () => document.documentElement.dataset.theme = W.colorScheme;
  theme(); W.onEvent('themeChanged', theme);
  W.BackButton.onClick(() => { if ($('#sheet').classList.contains('on')) closeSheet(); else back(); });
}
if (LIVE) sync().then(deepLink).catch(e => { $('#app').innerHTML = `<div class="empty" style="padding-top:30vh"><h2>Не получилось загрузить</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Обновить</button></div>`; });

</script>
</body>
</html>
